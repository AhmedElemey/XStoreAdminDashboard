<div class="form-row">
  <label>Name (English) *</label>
  <input [ngModel]="nameEn()" (ngModelChange)="nameEn.set($event)" name="nameEn" placeholder="Ramadan Kareem — up to 40% off" />
</div>
<div class="form-row">
  <label>Name (Arabic) *</label>
  <input [ngModel]="nameAr()" (ngModelChange)="nameAr.set($event)" name="nameAr" dir="rtl" placeholder="رمضان كريم" />
</div>
<div class="form-row">
  <label>Image
    @if (editing()) {
      <span class="muted" style="font-weight:400">(leave empty to keep current)</span>
    } @else {
      <span class="muted" style="font-weight:400">(jpg, png, webp)</span>
    }
  </label>
  <input #fileInput type="file" accept="image/jpeg,image/png,image/webp" />
</div>

<div class="d-actions">
  <button class="btn btn-g" style="flex:1;justify-content:center" (click)="drawer.close()">Cancel</button>
  <button class="btn btn-p" style="flex:1;justify-content:center" [disabled]="busy()" (click)="save()">
    {{ busy() ? 'Saving…' : editing() ? 'Save changes' : 'Add banner' }}
  </button>
</div>
